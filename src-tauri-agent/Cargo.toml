[package]
name = "gorka-agent"
version = "0.1.0"
description = "GORKA Agent Dashboard"
authors = ["GORKA Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gorka-shared = { path = "../shared" }
tauri = { version = "2", features = ["default"] }
tauri-utils = { version = "2" }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
hex = "0.4"