[package]
name = "gorka-client"
version = "0.1.0"
description = "GORKA Client Dashboard"
authors = ["GORKA Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["default", "tray-icon"] }
tauri-utils = { version = "2" }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
directories = "5"
thiserror = "1"
reqwest = { version = "0.11", features = ["json"] }
hex = "0.4"
sha2 = "0.10"
once_cell = "1"
argon2 = "0.5"
rand = "0.8"
rand_core = "0.6"
chacha20poly1305 = "0.10"
