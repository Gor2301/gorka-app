name: Build Windows Installers

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build Client Installer
        run: |
          npm run build
          Set-Content -Path src-tauri/tauri.override.json -Value '{"build":{"beforeBuildCommand":""}}'
          npx tauri build --bundles nsis --config src-tauri/tauri.override.json
        env:
          VITE_API_URL: https://api.gorka.click

      - name: Build Agent Installer
        run: |
          cd agent-dashboard
          npm install
          npm run build
          cd ../src-tauri-agent
          Set-Content -Path tauri.override.json -Value '{"build":{"beforeBuildCommand":""}}'
          npx tauri build --bundles nsis --config tauri.override.json
        env:
          VITE_API_URL: https://api.gorka.click

      - name: Upload Client Installer
        uses: actions/upload-artifact@v4
        with:
          name: gorka-client-setup
          path: '**/target/release/bundle/nsis/*.exe'

      - name: Upload Agent Installer
        uses: actions/upload-artifact@v4
        with:
          name: gorka-agent-setup
          path: '**/target/release/bundle/nsis/*.exe'
