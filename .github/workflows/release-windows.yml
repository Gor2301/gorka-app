name: Build Windows Installers

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build Client Installer
        run: npm run tauri build -- --bundles nsis
        env:
          VITE_API_URL: https://api.gorka.click

      - name: Build Agent Installer
        working-directory: src-tauri-agent
        run: |
          cd ../agent-dashboard
          npm install
          npm run build
          cd ../src-tauri-agent
          npx tauri build --bundles nsis
        env:
          VITE_API_URL: https://api.gorka.click

      - name: Upload Client Installer
        uses: actions/upload-artifact@v4
        with:
          name: gorka-client-setup
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload Agent Installer
        uses: actions/upload-artifact@v4
        with:
          name: gorka-agent-setup
          path: src-tauri-agent/target/release/bundle/nsis/*.exe
