[package]
name = "gorka-shared"
version = "0.1.0"
edition = "2021"

[lib]
name = "gorka_shared"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
hex = "0.4"